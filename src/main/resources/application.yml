server:
  # 服务端口（注意：本机存在环境变量 SERVER__PORT 会覆盖此配置，启动时需显式 SERVER__PORT=8092）
  port: 8092

spring:
  application:
    name: club-web
  datasource:
    url: jdbc:mysql://localhost:3306/club_web?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: CHANGE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # 排除 Spring AI 自动装配（api-key 为空时其 Bean 创建会失败导致启动失败），
  # 由 AgentService 在 key 非空时手工构建 ChatClient，空 key 走本地降级模板
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# Sa-Token 配置
sa-token:
  token-name: satoken          # token 请求头名称
  timeout: 86400               # token 有效期 24 小时
  is-read-cookie: false        # 不走 Cookie，前端用 Header 携带
  is-read-header: true
  is-print: false

# Spring AI：OpenAI 兼容接口配置（DeepSeek / 通义千问均可）
# 已配置 DeepSeek 真实 Key；⚠️ 上传 Gitee/公开仓库前请改回 ${AI_API_KEY:} 占位符，避免泄漏
spring.ai:
  openai:
    api-key:CHANGE_ME
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    chat:
      options:
        model: ${AI_MODEL:deepseek-chat}
        temperature: 0.7

# 业务自定义配置
club:
  upload-dir: ./upload         # 图片/文件本地存储目录
  ai-fallback-enabled: true    # AI 失败时是否降级为本地模板
